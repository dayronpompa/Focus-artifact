name: Update feeds
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths: ["channels.json"]
permissions:
  contents: write
jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_feeds.py
      - run: |
          git config user.name "feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add feeds.json
          git diff --cached --quiet || (git commit -m "Update feeds" && git push)
