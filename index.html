<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Focus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Focus Library</title>
<style>
:root{
  --bg:#0a0c10; --panel:#11141b; --card:#161a23; --line:#232836;
  --text:#e9ecf3; --muted:#8b93a7; --accent:#8fb0ff; --accent-ink:#0a1020; --danger:#ff8a94;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:radial-gradient(1200px 500px at 50% -10%,#151b2c 0%,var(--bg) 60%) fixed;color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{display:block}
[hidden]{display:none !important}

.app{height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

/* Stage */
.stage{flex:none;background:linear-gradient(180deg,#141a28 0%,#0f131c 100%);border-bottom:1px solid var(--line)}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px}
.bigplay{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 28px rgba(143,176,255,.35)}
.bigplay svg{width:30px;height:30px;margin-left:4px}
.now{padding:14px 16px 4px}
.now-title{font-weight:650;font-size:18px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.now-sub{color:var(--muted);font-size:13px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px 14px}
.ib{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;transition:background .2s}
.ib:active{background:rgba(255,255,255,.14)}
.ib svg{width:22px;height:22px}
.ib:disabled{opacity:.35}
.chip{height:44px;padding:0 16px;border-radius:22px;background:rgba(255,255,255,.07);color:var(--muted);font-size:14px;font-weight:550;white-space:nowrap}
.chip.on{background:rgba(143,176,255,.16);color:var(--accent)}
.spacer{flex:1}

/* Two videos at once */
.deck{border-radius:16px;transition:box-shadow .2s}
.stage.dual .deck{margin:8px 10px 0;padding-bottom:2px}
.stage.dual .ib{width:42px;height:42px}
.stage.dual .controls{gap:6px;padding:8px 10px 12px}
.stage.dual .chip{padding:0 12px;height:42px}
.stage.dual .deck.target{box-shadow:inset 0 0 0 2px var(--accent);background:rgba(143,176,255,.06)}
.stage.dual .deck .player{width:min(100%,calc(13dvh * 16 / 9));margin:8px auto 0;border-radius:10px;overflow:hidden}
.stage.dual .now{padding:8px 14px 8px;cursor:pointer}
.stage.dual .now-title{font-size:15px;-webkit-line-clamp:1}
.stage.dual .bigplay{width:48px;height:48px}.stage.dual .bigplay svg{width:20px;height:20px}
.stage.dual .empty{font-size:13px;padding:0 10px;text-align:center}
.slotb{position:absolute;left:4px;top:4px;z-index:1;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center}

@media (max-width:899px){ .stage.dual{max-height:64dvh;overflow-y:auto} }

/* Library */
.lib{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.lib-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.trpane{flex:1;min-height:0;display:flex;flex-direction:column}
.lib-head{flex:none;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(10,12,16,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.lib-head .btn{height:38px;padding:0 12px;white-space:nowrap;font-size:15px}
.sideb{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.sideb:hover{background:rgba(255,255,255,.07);color:var(--text)}
.sideb svg{width:20px;height:20px}
#sideOpen{display:none;position:absolute;left:14px;top:14px;z-index:3;background:rgba(255,255,255,.05)}
.btn{height:44px;padding:0 16px;border-radius:12px;background:var(--card);font-weight:550}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.on{background:rgba(143,176,255,.16);color:var(--accent)}

.folder{margin:12px 12px 0;background:linear-gradient(180deg,#141823,#10131a);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.folder.sub{margin:8px 10px 8px 26px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.folder.sub .folder.sub{background:var(--panel)}
.fhead{display:flex;align-items:center;gap:10px;min-height:62px;padding:0 14px;cursor:pointer;user-select:none;transition:background .2s}
.fhead:active{background:rgba(255,255,255,.03)}
.fhead .chev{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.folder.open > .fhead .chev{transform:rotate(90deg)}
.ficon{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:rgba(143,176,255,.10);font-size:21px;line-height:1}
.folder.sub .ficon{width:32px;height:32px;border-radius:10px;font-size:18px}
.fname{flex:1;min-width:0;font-weight:650;font-size:16.5px;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcount{min-width:26px;height:24px;padding:0 8px;border-radius:12px;background:rgba(255,255,255,.06);color:var(--muted);font-size:12.5px;font-weight:600;display:grid;place-items:center}
.fedit,.vedit{display:flex;flex-wrap:wrap;gap:8px}
.fedit{padding:0 14px 12px}
.vedit{margin-top:6px}
.mini{height:40px;padding:0 12px;border-radius:10px;font-size:14px;color:var(--muted);background:var(--bg)}
.folder.sub .mini{background:var(--panel)}
.mini.danger{color:var(--danger)}
/* Smooth open/close: animate the row height from 0fr to 1fr, fade the content */
.fbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.4,0,.2,1)}
.folder.open > .fbody{grid-template-rows:1fr}
.fin{min-height:0;overflow:hidden}
.fc{border-top:1px solid var(--line);opacity:0;transform:translateY(-6px);
  transition:opacity .22s ease, transform .34s cubic-bezier(.4,0,.2,1)}
.folder.open > .fbody > .fin > .fc{opacity:1;transform:none;transition-delay:.05s}
@media (prefers-reduced-motion:reduce){
  .fbody,.fc,.fhead .chev{transition:none !important}
}
.vid{position:relative;display:flex;align-items:center;gap:12px;min-height:74px;padding:10px 12px 10px 14px;cursor:pointer;transition:background .2s}
.vid + .vid{border-top:1px solid var(--line)}
.vid:active{background:rgba(255,255,255,.04)}
.thumb{position:relative;flex:none;width:96px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#1c2233,#12151d);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ic{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.28);transition:background .2s}
.thumb .ic svg{width:18px;height:18px;margin-left:1px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.vid.cur{background:linear-gradient(90deg,rgba(143,176,255,.14),rgba(143,176,255,0) 85%)}
.vid.cur::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.vid.cur .thumb .ic{background:rgba(10,16,32,.55);color:var(--accent)}
.vid.cur .vn{color:var(--accent)}
.vt{flex:1;min-width:0;display:flex;flex-direction:column}
.vn{overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;font-size:14.5px;line-height:1.3}
.vs{color:var(--muted);font-size:12px}
.none{padding:16px;color:var(--muted);font-size:14px}
.hint{padding:32px 20px;text-align:center;color:var(--muted)}
.tools{display:flex;gap:8px;padding:10px 12px 0}
.tools .mini{background:var(--panel)}
.newfolder{display:block;width:calc(100% - 24px);margin:12px 12px 0;height:56px;border-radius:16px;border:1px dashed var(--line);color:var(--accent);font-weight:600}
.newfolder:active{background:var(--panel)}
.eq{display:flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:currentColor;border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

.resizer{display:none;flex:none;width:12px;margin:0 -6px;position:relative;z-index:4;cursor:col-resize;touch-action:none;outline:none}
.resizer::after{content:"";position:absolute;left:5px;top:50%;width:2px;height:48px;margin-top:-24px;border-radius:2px;background:var(--line);transition:background .2s,height .2s,margin-top .2s}
.resizer:hover::after,.resizer:focus-visible::after,.resizer.drag::after{background:var(--accent);height:72px;margin-top:-36px}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe{pointer-events:none}

/* Selection + bulk actions */
.sel{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.sel svg{width:14px;height:14px}
.vid.picked{background:rgba(143,176,255,.10)}
.vid.picked .sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bulk{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;margin:14px 12px 0;display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-radius:18px;background:rgba(24,29,42,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.bulk .bn{flex:1;font-weight:600;font-size:15px}
.bulk .mini{background:rgba(255,255,255,.07);height:42px}
.bulk .mini.go{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* Sheet */
.sheet-bg{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:14px}
.tabs button{flex:1;height:40px;border-radius:10px;color:var(--muted);font-weight:550}
.tabs button.on{background:var(--card);color:var(--text)}
.sheet h2{margin:0;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none;width:100%;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.note{font-size:12px;color:var(--muted)}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:132px;overflow-y:auto;padding:2px}
.icons button{height:40px;border-radius:10px;background:var(--bg);font-size:21px;line-height:1}
.icons button.on{background:rgba(143,176,255,.2);outline:2px solid var(--accent)}
.err{color:var(--danger);font-size:13px}
.err:empty{display:none}
.row{display:flex;gap:8px}
.row .btn{flex:1;height:50px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (min-width:900px){
  .app{flex-direction:row;padding-top:0}
  .lib{order:1;flex:none;width:var(--libw,380px);border-right:1px solid var(--line)}
  .resizer{display:block;order:2}
  .stage{order:3;flex:1;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:24px 40px;overflow:auto}
  .player{max-width:1100px;margin:0 auto;border-radius:16px;overflow:hidden}
  .deck{width:100%;max-width:1100px;margin-left:auto;margin-right:auto}
  .stage.dual{justify-content:flex-start;gap:10px;padding:16px 32px;overflow:hidden}
  .stage.dual .deck{flex:1 1 0;min-height:0;max-width:none;margin:0;padding:10px 12px 6px;display:flex;flex-direction:column}
  .stage.dual .deck .player{flex:1 1 0;min-height:0;width:auto;max-width:100%;aspect-ratio:16/9;align-self:center;margin:0}
  .stage.dual .now,.stage.dual .controls{max-width:none;flex:none}
  .stage.dual .now{padding:8px 4px 0}
  .stage.dual .controls{padding:4px 0 0}
  .now,.controls{width:100%;max-width:1100px;margin:0 auto;padding-left:0;padding-right:0}
  .sheet-bg{align-items:center}
  .sheet{border-radius:22px}
}
@media (orientation:landscape) and (max-height:520px) and (max-width:899px){
  .app{flex-direction:row;padding-left:env(safe-area-inset-left)}
  .stage{width:56%;overflow-y:auto}
  .lib{border-left:1px solid var(--line)}
}

/* Notes and transcript */
.notes{--px:18px;display:none;position:relative;flex:1;min-height:0;min-width:0;flex-direction:column;background:#111318}
.app.notes-open .notes{display:flex;animation:slidein .38s cubic-bezier(.32,.72,0,1)}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
#notesOpen{display:none;position:absolute;right:14px;top:14px;z-index:3;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:14.5px;box-shadow:0 6px 20px rgba(143,176,255,.25);transition:transform .15s,box-shadow .15s}
#notesOpen:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(143,176,255,.35)}
#notesOpen svg{width:19px;height:19px}
#notesBtn{background:rgba(143,176,255,.16);color:var(--accent);font-weight:600}
.app:not(.can-notes) #notesBtn{display:none}
.app:not(.can-notes) #trTab{display:none}
.app.notes-open #notesBtn{display:none}
@media (prefers-reduced-motion:reduce){.app.notes-open .notes{animation:none}.lib,.notes,.stage{transition:none !important}}
.np-head{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px}
.ntabs{display:flex;gap:2px;padding:3px;background:var(--panel);border-radius:11px}
.ntabs button{height:32px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:550;font-size:14px}
.ntabs button.on{background:var(--card);color:var(--text)}
.notes .mini,.trpane .mini{height:34px;background:var(--panel);font-size:13px;padding:0 10px;white-space:nowrap}
.notes .mini.go,.trpane .mini.go{background:rgba(143,176,255,.16);color:var(--accent);font-weight:600}
#notesTr{display:none}
.np-none{flex:1;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.page{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.notes{container-type:inline-size}
@container (max-width:470px){.notes .pg-title,.notes .ed{--px:22px}.notes .pg-title{font-size:22px}}
.pg-title{margin:0;padding:22px var(--px) 10px;font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.2px;word-break:break-word}
.tbwrap{position:sticky;top:0;z-index:2;background:#111318;padding:4px 10px 6px;border-bottom:1px solid var(--line)}
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.tb button{flex:none;min-width:30px;height:32px;padding:0 6px;border-radius:7px;color:var(--muted);font-size:14px;font-weight:650;white-space:nowrap;transition:background .12s,color .12s}
.tb button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.tb button.on{background:rgba(143,176,255,.16);color:var(--accent)}
.tb i{flex:none;width:1px;height:18px;background:var(--line);margin:0 2px}
@media (max-width:899px){.pg-title{font-size:24px;padding-top:14px}}
.swatches{display:flex;flex-direction:column;gap:8px;padding:8px 6px 4px}
.corow{display:flex;flex-wrap:wrap;gap:6px;padding:8px 6px 4px}
.corow button{height:32px;padding:0 10px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text)}
/* Toggle callouts: a coloured block with an icon and a heading that folds its contents away */
.co{margin:.7em 0;border-radius:10px;padding:8px 12px 8px 8px;background:var(--co-bg);border:1px solid var(--co-line)}
.co[data-k="idea"]{--co-bg:rgba(202,152,73,.13);--co-line:rgba(202,152,73,.28)}
.co[data-k="video"]{--co-bg:rgba(94,135,201,.14);--co-line:rgba(94,135,201,.32)}
.co[data-k="note"]{--co-bg:rgba(155,155,155,.10);--co-line:rgba(155,155,155,.22)}
.co[data-k="key"]{--co-bg:rgba(223,84,82,.12);--co-line:rgba(223,84,82,.3)}
.co-h{display:flex;align-items:center;gap:6px;min-height:30px}
.co-t{flex:none;width:28px;height:28px;margin:-3px -3px -3px 0;display:grid;place-items:center;border-radius:6px;color:var(--muted);font-size:12px;cursor:pointer;transition:transform .2s;-webkit-user-select:none;user-select:none}
.co-t:hover,.co-i:hover{background:rgba(255,255,255,.08)}
.co[data-open="0"] .co-t{transform:rotate(-90deg)}
.co-i{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;font-size:17px;cursor:pointer;-webkit-user-select:none;user-select:none}
.co-l{flex:1;min-width:0;font-weight:650;font-size:17px;outline:none}
.co-b{padding:2px 0 2px 56px}
.co-b > :first-child{margin-top:.2em}
.co[data-open="0"] .co-b{display:none}
.co[data-open="0"] .co-h{cursor:pointer}
.co[data-open="0"] .co-l{cursor:pointer}
.spk-w{display:flex;align-items:center;gap:6px;margin-bottom:1px}
.spk-w .spk{margin:0}
.swap{width:22px;height:20px;border-radius:6px;color:var(--muted);font-size:12px;opacity:0;transition:opacity .15s}
.tp:hover .swap,.swap:focus-visible{opacity:1}
@media (hover:none){.swap{opacity:.6}}
.swap:hover{background:rgba(255,255,255,.08);color:var(--text)}
.swrow{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.swrow span{flex:none;width:62px;font-size:12px;color:var(--muted)}
.swrow button{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);font-size:13px;font-weight:700}
.ed{position:relative;min-height:60vh;padding:14px var(--px) calc(140px + env(safe-area-inset-bottom));outline:none;font-size:16px;line-height:1.6;word-break:break-word;-webkit-user-select:text;user-select:text}
.ed.blank::before{content:attr(data-ph);position:absolute;left:var(--px);right:var(--px);top:14px;color:var(--muted);pointer-events:none}
.ed h1{font-size:24px;line-height:1.25;margin:.7em 0 .3em}
.ed h2{font-size:20px;line-height:1.3;margin:.7em 0 .3em}
.ed h3{font-size:17px;margin:.7em 0 .3em}
.ed p,.ed div{margin:.3em 0}
.ed ul,.ed ol{margin:.3em 0;padding-left:1.4em}
.ed blockquote{margin:.6em 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 10px 10px 0}
.ed blockquote div{margin:.15em 0}
.ed a{color:var(--accent)}
.ed a.ts{display:inline-block;padding:1px 9px;border-radius:9px;background:rgba(143,176,255,.14);font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
.ed a.ts.pick{outline:2px solid var(--accent)}
.tr-bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}

    if (n.id === id) return { node:n, list };
    const r = findNode(id, n.children);
    if (r) return r;
  }
  return null;
}
function flatten(list, depth, trail, out){
  out = out || []; depth = depth || 0; trail = trail || [];
  for (const n of list){
    const t = trail.concat(n.name);
    out.push({ node:n, depth, label:(n.icon || '📁') + ' ' + t.join(' › ') });
    flatten(n.children, depth + 1, t, out);

}

function parseT(s){
  if (!s) return 0;
  if (/^\d+$/.test(s)) return +s;
  const m = s.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
  return m ? (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0) : 0;
}
function parseYT(input){
  let s = (input||'').trim();
  if (!s) return null;
  if (!/^https?:\/\//i.test(s)){

  }
  let u; try { u = new URL(s); } catch(e){ return null; }
  const host = u.hostname.replace(/^(www\.|m\.)/, '');
  let vid = null, list = u.searchParams.get('list') || null;
  if (host === 'youtu.be') vid = u.pathname.slice(1).split('/')[0];
  else if (host.endsWith('youtube.com') || host.endsWith('youtube-nocookie.com')){
    if (u.pathname === '/watch') vid = u.searchParams.get('v');
    else { const m = u.pathname.match(/^\/(shorts|embed|live|v)\/([\w-]{11})/); if (m) vid = m[2]; }
  } else return null;
  if (vid && !/^[\w-]{11}$/.test(vid)) vid = null;
  if (list && !/^[\w-]+$/.test(list)) list = null;
  if (list && /^RD/.test(list)) list = null;
  if (!vid && !list) return null;
  return { vid, list, t:parseT(u.searchParams.get('t') || u.searchParams.get('start')) };
}
function embedUrl(v, startAt){
  const p = new URLSearchParams({ autoplay:'1', playsinline:'1', rel:'0', modestbranding:'1', enablejsapi:'1' });
  if (/^https?:$/.test(location.protocol)) p.set('origin', location.origin);
  const t = startAt != null ? Math.floor(startAt) : v.t;
  let base;
  if (!v.vid){ base = 'https://www.youtube.com/embed/videoseries'; p.set('list', v.list); }
  else {
    base = 'https://www.youtube.com/embed/' + v.vid;
    if (v.list) p.set('list', v.list);
    if (t) p.set('start', String(t));
  }
  if (state.loop){ p.set('loop','1'); if (v.vid && !v.list) p.set('playlist', v.vid); }
  return base + '?' + p.toString();
}

/* ---------- Titles and channel feeds ---------- */
async function fetchJson(url, ms){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 6000);
  try {
    const r = await fetch(url, { signal:ctl.signal, cache:'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
const titleCache = {};
async function fetchTitle(vid){
  if (titleCache[vid]) return titleCache[vid];
  const watch = 'https://www.youtube.com/watch?v=' + vid;
  const urls = [
    'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(watch),
    'https://noembed.com/embed?url=' + encodeURIComponent(watch)
  ];
  for (const u of urls){
    try { const j = await fetchJson(u); if (j && j.title){ titleCache[vid] = String(j.title); return titleCache[vid]; } }
    catch(e){}
  }
  return null;
}
let feedsP = null;
function loadFeeds(force){
  if (!feedsP || force) feedsP = fetchJson('feeds.json', 6000)
    .then(j => (j && j.channels) ? j : { channels:{} })
    .catch(() => ({ channels:{} }));
  return feedsP;
}
const syncing = new Set();
async function syncNode(f){
  if (!f.channel || syncing.has(f.id)) return 0;
  syncing.add(f.id);
  try {
    const feeds = await loadFeeds();
    const ch = feeds.channels[f.channel.ref];
    if (!ch || !Array.isArray(ch.videos)) return 0;
    const vids = ch.videos.filter(v => v && v.id);
    const seen = new Set(f.channel.seen || []);
    const fresh = vids.filter(v => !seen.has(v.id));
    const add = f.channel.last ? fresh : fresh.slice(0, FIRST_SYNC);   // feed is newest first
    f.videos = add.map(v => ({ id:rid(), title:String(v.title || 'Untitled'), vid:v.id, list:null, t:0 })).concat(f.videos);
    for (const v of vids) seen.add(v.id);
    f.channel.seen = Array.from(seen).slice(-400);
    f.channel.last = Date.now();
    save();
    return add.length;
  } finally { syncing.delete(f.id); }
}
async function autoSync(force){
  if (force) await loadFeeds(true);
  let total = 0;
  for (const x of flatten(state.folders)){ if (x.node.channel) total += await syncNode(x.node); }
  if (total){ renderAll(false); toast(total + ' new video' + (total > 1 ? 's' : '')); }
}

/* ---------- Playback ---------- */
function showEmpty(slot){
  if (slot === undefined){ showEmpty(0); if (state.dual) showEmpty(1); return; }
  const box = $(slot ? 'player2' : 'player'); box.replaceChildren();
  const c = findCur(slot);
  if (c){
    const b = h('button', { class:'bigplay', 'aria-label':'Play' });
    b.innerHTML = ICON.play;
    b.addEventListener('click', () => play(c.f.id, c.v.id, slot));
    box.append(h('div', { class:'empty' }, b));
  } else {
    box.append(h('div', { class:'empty' }, state.dual ? 'Pick a video for player ' + (slot ? 'B' : 'A') : 'Pick a video from your library'));
  }
}
function play(fid, vid, slot, startAt){
  if (slot === undefined) slot = activeSlot();
  const r = findNode(fid); if (!r) return;
  const v = r.node.videos.find(x => x.id === vid); if (!v) return;
  if (slot){ state.cur2 = { f:fid, v:vid }; playing2 = true; } else { state.cur = { f:fid, v:vid }; playing = true; }
  if (state.dual && !curOf(slot ? 0 : 1)) target = slot ? 0 : 1;
  save();
  const box = $(slot ? 'player2' : 'player'); box.replaceChildren();
  const frame = h('iframe', {
    src:embedUrl(v, startAt), title:v.title, allowfullscreen:'',
    allow:'autoplay; encrypted-media; picture-in-picture; fullscreen',
    referrerpolicy:'strict-origin-when-cross-origin'
  });
  yt[slot] = { ready:false, t:startAt != null ? startAt : (v.t || 0) };
  frame.addEventListener('load', () => ytListen(slot, frame));
  box.append(frame);
  renderAll(false);
}
function stop(slot){
  if (slot === undefined){ playing = false; playing2 = false; showEmpty(); }
  else if (slot){ playing2 = false; showEmpty(1); } else { playing = false; showEmpty(0); }
  renderAll(false);
}
function setDual(on){
  state.dual = on;
  if (on){ target = curOf(1) ? 0 : 1; }
  else { state.cur2 = null; playing2 = false; $('player2').replaceChildren(); target = 0; }
  save(); renderAll(false);
  if (on) showEmpty(1);
}
function step(dir){
  const slot = activeSlot();
  const c = findCur(slot); if (!c) return;
  const list = c.f.videos; if (list.length < 2) return;
  const i = list.findIndex(x => x.id === c.v.id);
  play(c.f.id, list[(i + dir + list.length) % list.length].id, slot);
}

const armed = new Set();
function confirmBtn(key, label, onGo){
  const b = h('button', { class:'mini danger' }, label);
  b.addEventListener('click', ev => {
    ev.stopPropagation();
    if (armed.has(key)){ armed.delete(key); onGo(); return; }
    armed.add(key); b.textContent = 'Sure?';
    setTimeout(() => { if (armed.delete(key)) b.textContent = label; }, 3000);
  });
  return b;
}
function mini(label, fn){ return h('button', { class:'mini', onclick:ev => { ev.stopPropagation(); fn(); } }, label); }

function renderNode(f, depth){
  const head = h('div', { class:'fhead', role:'button', tabindex:'0' },
    icon(ICON.chev),
    h('span', { class:'ficon' }, f.icon || '📁'),

    h('span', { class:'fcount' }, String(countAll(f)))
  );

  const toggle = () => { f.open = !f.open; if (wrap) wrap.classList.toggle('open', f.open); save(); };
  head.addEventListener('click', toggle);
  head.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });

  let edit = null;
  if (editMode){
    edit = h('div', { class:'fedit' },
      mini('Rename', () => openSheet('renamefolder', { id:f.id })),
      f.videos.length ? mini(f.videos.every(v => selected.has(v.id)) ? 'Deselect all' : 'Select all', () => {
        const all = f.videos.every(v => selected.has(v.id));
        for (const v of f.videos) all ? selected.delete(v.id) : selected.add(v.id);
        renderFolders();
      }) : null,
      mini('+ Subfolder', () => openSheet('folder', { parent:f.id })),
      f.channel ? mini('Sync now', async () => {
        await loadFeeds(true);
        const c = await syncNode(f);
        renderAll(false); toast(c ? c + ' new video' + (c > 1 ? 's' : '') : 'Already up to date');
      }) : null,

  const fc = h('div', { class:'fc' });
  const body = h('div', { class:'fbody' }, h('div', { class:'fin' }, fc));
  for (const c of f.children) fc.append(renderNode(c, depth + 1));
  if (!f.children.length && !f.videos.length) fc.append(h('div', { class:'none' }, 'Empty.'));
  for (const v of f.videos){
    const rowSlot = slotOfVid(v.id);

    const ic = h('span', { class:'ic' });
    ic.innerHTML = (isCur && isPlaying(rowSlot)) ? ICON.eq : ICON.play;
    const thumb = h('span', { class:'thumb' });
    if (state.dual && isCur) thumb.append(h('span', { class:'slotb' }, rowSlot ? 'B' : 'A'));
    if (v.vid){
      const im = h('img', { src:'https://i.ytimg.com/vi/' + v.vid + '/mqdefault.jpg', alt:'', loading:'lazy', decoding:'async', referrerpolicy:'no-referrer' });
      im.addEventListener('error', () => im.remove());
      thumb.append(im);
    }
    thumb.append(ic);
    const picked = selected.has(v.id);
    const chk = editMode ? h('span', { class:'sel' }) : null;
    if (chk) chk.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const row = h('div', { class:'vid' + (isCur ? ' cur' : '') + (picked ? ' picked' : ''), role:'button', tabindex:'0' },
      chk,
      thumb,
      h('span', { class:'vt' },
        h('span', { class:'vn' }, v.title),
        (!v.vid && v.list) ? h('span', { class:'vs' }, 'Playlist') : null,
        (v.vid && noted.has(v.vid)) ? h('span', { class:'vs' }, 'Has notes') : null,
        editMode ? h('span', { class:'vedit' },
          mini('Rename', () => openSheet('renamevideo', { f:f.id, v:v.id })),
          mini('Move', () => openSheet('move', { ids:[v.id] })),
          confirmBtn('v' + v.id, 'Delete', () => deleteVideo(f.id, v.id))
        ) : null
      )
    );
    const go = () => { if (editMode) toggleSel(v.id); else play(f.id, v.id); };
    row.addEventListener('click', go);
    row.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); go(); } });
    fc.append(row);
  }
  wrap = h('div', { class:'folder' + (depth ? ' sub' : '') + (f.open ? ' open' : '') }, head, edit, body);
  return wrap;
}

/* ---------- Edit ---------- */
const selected = new Set();
function findVideo(vid){
  for (const x of flatten(state.folders)){
    const v = x.node.videos.find(y => y.id === vid);
    if (v) return { folder:x.node, video:v };
  }
  return null;
}
function moveVideos(ids, dest){
  let n = 0;
  for (const id of ids){
    const hit = findVideo(id);
    if (!hit || hit.folder.id === dest.id) continue;
    hit.folder.videos = hit.folder.videos.filter(y => y.id !== id);
    dest.videos.push(hit.video);
    if (state.cur && state.cur.v === id) state.cur.f = dest.id;
    if (state.cur2 && state.cur2.v === id) state.cur2.f = dest.id;
    n++;
  }
  if (n) dest.open = true;
  return n;
}
function deleteSelected(){
  const ids = [...selected];
  for (const id of ids){
    const hit = findVideo(id); if (!hit) continue;
    hit.folder.videos = hit.folder.videos.filter(y => y.id !== id);
    forgetVideo(id);
  }
  selected.clear(); save(); renderAll(false);
  toast('Deleted ' + ids.length + (ids.length > 1 ? ' videos' : ' video'));
}
function toggleSel(id){ if (selected.has(id)) selected.delete(id); else selected.add(id); renderFolders(); }
function renderBulk(){
  const b = $('bulk');
  b.hidden = !(editMode && selected.size);
  b.replaceChildren();
  if (b.hidden) return;
  b.append(
    h('span', { class:'bn' }, selected.size + ' selected'),
    h('button', { class:'mini go', onclick:() => openSheet('move', { ids:[...selected] }) }, 'Move'),
    confirmBtn('bulkdel', 'Delete', deleteSelected),
    h('button', { class:'mini', 'aria-label':'Clear selection', onclick:() => { selected.clear(); renderFolders(); } }, '✕')
  );
}
function deleteVideo(fid, vid){
  const r = findNode(fid); if (!r) return;
  r.node.videos = r.node.videos.filter(v => v.id !== vid);
  forgetVideo(vid);
  save(); renderAll(false);
}
function deleteFolder(fid){
  const r = findNode(fid); if (!r) return;
  forgetFolder(r.node);
  const i = r.list.indexOf(r.node); if (i >= 0) r.list.splice(i, 1);
  save(); renderAll(false);
}

/* ---------- Backup ---------- */
async function exportBackup(){
  await flushNote();
  let notes = [], transcripts = [];
  try { notes = await DB.all('notes'); transcripts = await DB.all('transcripts'); } catch(e){}
  const blob = new Blob([JSON.stringify(Object.assign({}, state, { notes, transcripts }))], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'focus-library-backup.json';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importBackup(file){
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const raw = JSON.parse(String(rd.result));
      const r = normalize(raw);
      if (!r.folders.length) throw new Error('empty');
      state = r; state.updated = Date.now(); localSave();
      playing = false; playing2 = false; target = 0; showEmpty(); renderAll(false); toast('Backup restored');
      importNotes(raw);
    } catch(e){ toast('That file is not a Focus Library backup.'); }
  };
  rd.readAsText(file);
}

let sheetMode = 'video', sheetCtx = null, pickedIcon = '📁', titleTouched = false, fetchSeq = 0, saving = false;
const SHOW = {
  video:['fUrl','fTitle','fFolder'],
  folder:['fName','fIcons','fParent','fChan'],
  renamefolder:['fName','fIcons','fChan'],
  renamevideo:['fTitle'],
  move:['fFolder']

const ALL_FIELDS = ['fUrl','fTitle','fFolder','fName','fIcons','fParent','fChan'];
const HEAD = { renamefolder:'Edit folder', renamevideo:'Rename video', move:'Move to folder' };

function setPane(mode){
  sheetMode = mode;

  $('tabs').hidden = !isTab;
  $('sheetTitle').hidden = isTab; $('sheetTitle').textContent = HEAD[mode] || '';

function fillSelect(sel, selectedId, withTop){

function buildIcons(){

async function fillChannels(current){
  const sel = $('chan');
  sel.replaceChildren(h('option', { value:'' }, 'None'));
  const feeds = await loadFeeds();
  const keys = Object.keys(feeds.channels);
  for (const k of keys) sel.append(h('option', { value:k }, feeds.channels[k].name || k));
  if (current && keys.indexOf(current) < 0) sel.append(h('option', { value:current }, current));
  sel.value = current || '';

function openSheet(mode, ctx){
  if (mode === 'video' && !state.folders.length) mode = 'folder';
  sheetCtx = ctx || null;
  setPane(mode);
  $('url').value = ''; $('title').value = ''; $('fname').value = '';
  titleTouched = false; fetchSeq++; saving = false;
  pickedIcon = '📁';
  if (mode === 'video'){
    const pref = (state.cur && state.cur.f) || (state.folders[0] && state.folders[0].id);
    fillSelect($('fsel'), pref, false);
  } else if (mode === 'folder'){
    fillSelect($('psel'), ctx && ctx.parent, true);
    buildIcons(); fillChannels('');
  } else if (mode === 'renamefolder'){
    const r = findNode(ctx.id); if (!r) return;

function closeSheet(){ $('sheetBg').classList.remove('open'); fetchSeq++; }

async function onUrlInput(){
  const p = parseYT($('url').value);
  const seq = ++fetchSeq;
  if (!p || !p.vid || titleTouched || sheetMode !== 'video') return;
  $('title').placeholder = 'Fetching title…';
  const t = await fetchTitle(p.vid);
  if (seq !== fetchSeq || titleTouched) return;
  if (t) $('title').value = t;
  $('title').placeholder = t ? '' : 'Type a title (lookup unavailable)';
}

async function submitSheet(){
  if (saving) return;
  const err = $('err'); err.textContent = '';
  if (sheetMode === 'video'){
    const p = parseYT($('url').value);
    if (!p){ err.textContent = 'That is not a YouTube link.'; return; }
    const r = findNode($('fsel').value); if (!r){ err.textContent = 'Pick a folder.'; return; }
    saving = true;
    let title = $('title').value.trim();
    if (!title && p.vid) title = (await fetchTitle(p.vid)) || '';
    if (!title) title = (!p.vid && p.list) ? 'Playlist' : 'Untitled';
    saving = false;
    r.node.videos.push({ id:rid(), title, vid:p.vid, list:p.list, t:p.t });
    r.node.open = true;
    save(); renderAll(false); closeSheet(); toast('Added to ' + r.node.name);
  } else if (sheetMode === 'move'){
    const dest = findNode($('fsel').value); if (!dest){ err.textContent = 'Pick a folder.'; return; }
    const n = moveVideos(sheetCtx.ids, dest.node);
    selected.clear(); save(); renderAll(false); closeSheet();
    toast(n ? 'Moved ' + n + ' to ' + dest.node.name : 'Already in ' + dest.node.name);
  } else if (sheetMode === 'renamevideo'){
    const title = $('title').value.trim();
    if (!title){ err.textContent = 'Enter a title.'; return; }
    const r = findNode(sheetCtx.f); const v = r && r.node.videos.find(x => x.id === sheetCtx.v);
    if (v) v.title = title;
    save(); renderAll(false); closeSheet();
  } else {
    const name = $('fname').value.trim();
    if (!name){ err.textContent = 'Enter a name.'; return; }
    const ref = $('chan').value;
    let node, isNew = false;
    if (sheetMode === 'renamefolder'){
      const r = findNode(sheetCtx.id); if (!r) return;
      node = r.node; node.name = name; node.icon = pickedIcon;
    } else {
      node = newNode(name, pickedIcon); isNew = true;
      const par = $('psel').value ? findNode($('psel').value) : null;
      if (par){ par.node.children.push(node); par.node.open = true; } else state.folders.push(node);
    }
    const changedChan = ref ? (!node.channel || node.channel.ref !== ref) : !!node.channel;
    if (changedChan) node.channel = ref ? { ref, last:0, seen:[] } : null;
    save(); renderAll(false); closeSheet();
    if (node.channel && (isNew || changedChan)){
      const c = await syncNode(node);
      renderAll(false); toast(c + ' video' + (c === 1 ? '' : 's') + ' added');
    }
  }
}

/* Notes and transcripts live in IndexedDB (they outgrow localStorage). Falls back to memory if it is unavailable. */
const DB = (function(){
  const mem = { notes:new Map(), transcripts:new Map() };
  let dbp = null;
  function open(){
    if (!dbp) dbp = new Promise(res => {
      let rq; try { rq = indexedDB.open('focus-notes', 1); } catch(e){ res(null); return; }
      rq.onupgradeneeded = () => {
        for (const s of ['notes','transcripts']) if (!rq.result.objectStoreNames.contains(s)) rq.result.createObjectStore(s, { keyPath:'vid' });
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = rq.onblocked = () => res(null);
    });
    return dbp;
  }
  function run(d, store, mode, fn){
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode), rq = fn(t.objectStore(store));
      t.oncomplete = () => res(rq.result);
      t.onerror = t.onabort = () => rej(t.error || new Error('storage'));
    });
  }
  return {
    async get(s, k){ const d = await open(); return d ? run(d, s, 'readonly', o => o.get(k)) : mem[s].get(k); },
    async put(s, v){ const d = await open(); if (d) return run(d, s, 'readwrite', o => o.put(v)); mem[s].set(v.vid, v); },
    async del(s, k){ const d = await open(); if (d) return run(d, s, 'readwrite', o => o.delete(k)); mem[s].delete(k); },
    async all(s){ const d = await open(); return d ? run(d, s, 'readonly', o => o.getAll()) : Array.from(mem[s].values()); },
    async keys(s){ const d = await open(); return d ? run(d, s, 'readonly', o => o.getAllKeys()) : Array.from(mem[s].keys()); }
  };
})();

function fmtT(s){

}
/* A link back into this app: opens the video here at that second. */
function deepLink(vid, t){ return location.origin + location.pathname + '?v=' + vid + (t ? '&t=' + Math.floor(t) : ''); }
function chipText(t, e, name){ return '▶ ' + fmtT(t) + (e > t ? '–' + fmtT(e) : '') + (name ? ' · ' + name : ''); }
function makeChip(vid, t, e, name){
  t = Math.floor(t); e = Math.floor(e || 0);
  const a = h('a', { class:'ts', href:deepLink(vid, t), 'data-v':vid, 'data-t':String(t), contenteditable:'false' });
  if (e > t) a.setAttribute('data-e', String(e));

/* Notes are stored as HTML. Everything that goes in or out passes through this allow-list. */
function sanitize(html){
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  const walk = node => {
    for (const c of Array.from(node.childNodes)){
      if (c.nodeType === 3) continue;
      if (c.nodeType !== 1 || c.namespaceURI !== 'http://www.w3.org/1999/xhtml' || DROP_TAGS.has(c.tagName)){ c.remove(); continue; }
      if (c.tagName === 'A' && /^[\w-]{11}$/.test(c.getAttribute('data-v') || '') && /^\d+$/.test(c.getAttribute('data-t') || '')){
        c.replaceWith(makeChip(c.getAttribute('data-v'), +c.getAttribute('data-t'), +c.getAttribute('data-e') || 0, (c.getAttribute('data-n') || '').slice(0, 200)));
        continue;
      }
      walk(c);
      if (!OK_TAGS.has(c.tagName)){ c.replaceWith(...Array.from(c.childNodes)); continue; }
      const href = c.tagName === 'A' ? (c.getAttribute('href') || '') : '';
      const cls = c.getAttribute('class') || '', dk = c.getAttribute('data-k') || '', dop = c.getAttribute('data-open');
      const col = c.tagName === 'FONT' ? (c.getAttribute('color') || '') : '';
      const css = OK_STYLE.map(p => {
        const v = c.style.getPropertyValue(p);
        return v && !/url|expression|[;{}<>]/i.test(v) ? p + ':' + v : '';
      }).filter(Boolean).join(';');
      for (const a of Array.from(c.attributes)) c.removeAttribute(a.name);
      if ((c.tagName === 'DIV' || c.tagName === 'SPAN') && CO_CLASSES.has(cls)){
        c.setAttribute('class', cls);
        if (cls === 'co'){ c.setAttribute('data-k', CO_KINDS[dk] ? dk : 'note'); c.setAttribute('data-open', dop === '0' ? '0' : '1'); }
        if (cls === 'co-t' || cls === 'co-i') c.setAttribute('contenteditable', 'false');
      }
      if (css) c.setAttribute('style', css);
      if (col && /^[#\w(),.\s%]+$/.test(col)) c.setAttribute('color', col);
      if (c.tagName === 'A'){
        if (/^https?:\/\//i.test(href)){ c.setAttribute('href', href); c.setAttribute('target', '_blank'); c.setAttribute('rel', 'noopener'); }
        else c.replaceWith(...Array.from(c.childNodes));
      }
    }
  };
  walk(tpl.content);
  return tpl.innerHTML;
}

/* ----- Player link: read the current time and seek, by messaging the embedded player ----- */

window.addEventListener('message', e => {

  if (!d) return;
  const slot = [0, 1].find(s => { const f = frameOf(s); return f && f.contentWindow === e.source; });
  if (slot === undefined) return;
  yt[slot].ready = true;
  if (d.info && typeof d.info.currentTime === 'number'){ yt[slot].t = d.info.currentTime; yt[slot].at = performance.now(); }
  if (d.info && typeof d.info.playerState === 'number') yt[slot].st = d.info.playerState;

/* ----- Copy for Notion: rich text on the clipboard, Markdown as the plain-text fallback ----- */
function toMd(root){
  const inl = n => {
    let o = '';
    for (const c of n.childNodes){
      if (c.nodeType === 3){ o += c.data; continue; }
      if (c.nodeType !== 1) continue;
      const t = c.tagName, x = inl(c);
      if (t === 'BR') o += '\n';
      else if (!x.trim()) o += x;
      else if (t === 'B' || t === 'STRONG') o += '**' + x + '**';
      else if (t === 'I' || t === 'EM') o += '*' + x + '*';
      else if (t === 'S' || t === 'STRIKE' || t === 'DEL') o += '~~' + x + '~~';
      else if (t === 'A') o += '[' + x + '](' + c.getAttribute('href') + ')';
      else o += x;
    }
    return o;
  };
  const out = [];
  const push = (pre, x) => { x = x.trim(); if (x) out.push(pre + x.replace(/\n/g, '\n' + pre)); };
  const blk = (n, pre) => {
    for (const c of n.childNodes){
      if (c.nodeType === 3){ push(pre, c.data); continue; }
      if (c.nodeType !== 1) continue;
      const t = c.tagName;
      if (/^H[1-3]$/.test(t)) push(pre + '#'.repeat(+t[1]) + ' ', inl(c));
      else if (t === 'UL' || t === 'OL'){ let i = 1; for (const li of c.children) push(pre + (t === 'OL' ? (i++) + '. ' : '- '), inl(li)); }
      else if (t === 'BLOCKQUOTE') blk(c, pre + '> ');
      else if (t === 'HR') out.push('---');
      else if ((t === 'P' || t === 'DIV') && c.querySelector('p,div,ul,ol,blockquote,h1,h2,h3')) blk(c, pre);
      else push(pre, inl(c));
    }
  };
  blk(root, '');
  return out.join('\n\n');
}

function spName(tr, raw){
  if (tr && tr.names && tr.names[raw]) return tr.names[raw];
  const m = /^SPEAKER[_ ](\d+)$/i.exec(raw);
  return m ? 'Speaker ' + (+m[1] + 1) : raw;

/* Different actors name their fields differently; reduce them all to {s, e, t, sp}. */
/* Word-timed output can come as one long block per speaker turn: cut it into chunks of a sentence or a few, keeping every word's time. */
function chunkWords(words, sp0){
  const out = []; let cur = null;
  const r2 = n => Math.round(n * 100) / 100;
  for (const w of words){
    const t = String((w && (w.word != null ? w.word : w.text)) || '').trim();
    const s = +(w && w.start);
    if (!t || !isFinite(s)) continue;
    const e = Math.max(isFinite(+w.end) ? +w.end : s, s);
    const sp = w.speaker != null ? String(w.speaker) : sp0;
    const brk = !cur || sp !== cur.sp || s - cur.e > 1.5 || s - cur.s > 20 || (s - cur.s > 7 && /[.!?…]["”')]?$/.test(cur.last));
    if (brk){ cur = { s, e, sp, w:[], last:'' }; out.push(cur); }
    cur.w.push([r2(s), r2(e), t]); cur.e = Math.max(cur.e, e); cur.last = t;
  }
  return out.map(c => ({ s:c.s, e:c.e, t:c.w.map(x => x[2]).join(' '), sp:c.sp, w:c.w }));
}
function normTranscript(items, vid){
  const list = Array.isArray(items) ? items : [];
  const it = list.find(x => x && (Array.isArray(x.segments) || Array.isArray(x.timestamped)));
  const segs = [];
  for (const x of (it ? (it.segments || it.timestamped) : [])){
    if (x && Array.isArray(x.words) && x.words.length){ segs.push(...chunkWords(x.words, x.speaker != null ? String(x.speaker) : '')); continue; }
    const t = String((x && x.text) || '').replace(/\s+/g, ' ').trim();
    if (!t) continue;
    const s = Math.max(0, +x.start || 0);
    const e = x.end != null ? +x.end : s + (+x.duration || 0);
    segs.push({ s, e:Math.max(e || 0, s), t, sp:x.speaker != null ? String(x.speaker) : '' });
  }
  if (!segs.length){
    const bad = list[0] || {}, why = bad.error || bad.errorMessage || bad.message;
    throw new Error(why ? String(typeof why === 'string' ? why : JSON.stringify(why)).slice(0, 200) : 'No transcript came back for this video.');
  }
  segs.sort((a, b) => a.s - b.s);

}

    if (brk){ cur = { sp:g.sp, s:g.s, idx:[] }; out.push(cur); }
    cur.idx.push(i);
  });

}

/* Captions mark each change of speaker with ">>". A speaker code says who speaks in each of those turns. */
function splitTurns(segs){
  const out = []; let ti = 0, has = false;
  for (const g of segs){
    const parts = g.t.split('>>'), n = parts.length, d = Math.max(0, g.e - g.s);

      if (!t) return;
      out.push({ s:g.s + d * (k / n), e:g.s + d * ((k + 1) / n), t, ti });

async function apify(path, body){

  if (body !== undefined){ o.method = 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }

  catch(e){ const er = new Error('Could not reach Apify. Check the connection.'); er.net = true; throw er; }
  let j = null; try { j = await r.json(); } catch(e){}

  }

    else { delete runs[vid]; trErr[vid] = e.message; }
    lsSet(RUNS_KEY, runs);
    if (vid === noteVid) trBar();
  } finally { watching.delete(vid); }
}
function resumeRuns(){
  for (const vid of Object.keys(runs)){
    if (Date.now() - (runs[vid].at || 0) > 12 * 3600 * 1000){ delete runs[vid]; lsSet(RUNS_KEY, runs); continue; }
    watchRun(vid);
  }
}
/* What is selected in the transcript: the words, and the start and end time of the lines they sit in. */
function selPart(el, rg){
  const r = document.createRange(); r.selectNodeContents(el);
  if (el.contains(rg.startContainer)) r.setStart(rg.startContainer, rg.startOffset);
  if (el.contains(rg.endContainer)) r.setEnd(rg.endContainer, rg.endOffset);
  return r.toString();
}
function edgeWord(sg, rg, first){
  const ws = sg.children; let hit = -1;
  for (let j = 0; j < ws.length; j++){
    if (!rg.intersectsNode(ws[j]) || !selPart(ws[j], rg).trim()) continue;
    hit = j; if (first) break;
  }
  return hit;
}
function readSel(){
  const sel = window.getSelection(), body = $('trBody');
  if (!curTr || !sel || sel.isCollapsed || !sel.rangeCount) return null;
  const rg = sel.getRangeAt(0);
  if (!body.contains(rg.commonAncestorContainer)) return null;
  const lines = []; let first = -1, last = -1;
  for (const sp of segEls){
    if (!rg.intersectsNode(sp)){ if (first >= 0) break; continue; }
    const t = selPart(sp, rg);
    if (!t.trim()) continue;
    const i = +sp.dataset.i, who = curTr.segs[i].sp;
    if (first < 0) first = i;
    last = i;
    if (lines.length && lines[lines.length - 1].sp === who) lines[lines.length - 1].text += t;
    else lines.push({ sp:who, text:t });
  }
  if (first < 0) return null;
  for (const l of lines) l.text = l.text.replace(/\s+/g, ' ').trim();
  const a = curTr.segs[first], b = curTr.segs[last];
  let s0 = a.s, e0 = b.e;
  if (a.w){ const k = edgeWord(segEls[first], rg, true); if (k >= 0) s0 = a.w[k][0]; }
  if (b.w){ const k = edgeWord(segEls[last], rg, false); if (k >= 0) e0 = b.w[k][1]; }
  return { s:s0, e:e0, i0:first, i1:last, lines, text:lines.map(l => l.text).join(' ') };
}
function checkSel(){
  if (leftTab !== 'tr' || $('trPane').hidden || !$('lib').offsetParent) return;
  const q = readSel(); if (!q) return;
  const btns = [['Save quote', () => saveQuote(false), 'go'], ['Link only', () => saveQuote(true)]];
  if (curTr.kind === 'speakers') btns.push(['Speaker ⇄', () => { const p0 = pend; hideBar(); switchSpeaker(p0.i0, p0.i1); }]);
  bar(fmtT(q.s) + '–' + fmtT(q.e) + '  ' + q.text, btns, $('lib'));
  pend = q;
}
async function saveQuote(linkOnly){
  const q = pend, vid = noteVid, tr = curTr;
  if (!q || !vid) return;

  const r = await ask({ title:(linkOnly ? 'Link ' : 'Save quote ') + fmtT(q.s) + (q.e > q.s ? '–' + fmtT(q.e) : ''),
    fields:[{ id:'name', label:'Link title (optional)', placeholder:hint }], ok:'Add to notes' });
  if (!r || vid !== noteVid) return;
  const chip = makeChip(vid, q.s, q.e, r.name.trim().slice(0, 200));
  if (linkOnly) insertBlocks([h('p', null, chip)]);
  else {
    const bq = h('blockquote', null, h('div', null, chip));
    for (const l of q.lines) bq.append(h('div', null, l.sp ? h('b', null, spName(tr, l.sp) + ': ') : null, l.text));

async function renameSpeaker(raw){
  const tr = curTr; if (!tr) return;

    fields:[{ id:'name', label:'Name', value:(tr.names && tr.names[raw]) || '', placeholder:spName(null, raw) }] });
  if (!r || curTr !== tr) return;

/* ----- Live highlight: the line and word being spoken, following the player ----- */
let segEls = [], nowSeg = -1, nowWord = null, follow = true;
function playerNow(){
  const c = notesCtx(); if (!c || !isPlaying(c.slot)) return null;
  const y = yt[c.slot]; if (!y.ready || y.at == null) return null;
  const run = y.st === 1 || y.st == null;
  return y.t + (run ? Math.min(1.5, (performance.now() - y.at) / 1000) * (y.rate || 1) : 0);
}
function findSeg(t){
  const g = curTr.segs; let lo = 0, hi = g.length - 1, r = -1;
  while (lo <= hi){ const m = (lo + hi) >> 1; if (g[m].s <= t){ r = m; lo = m + 1; } else hi = m - 1; }
  return r;
}
function paintFollow(){
  const b = $('followBtn'); if (!b) return;
  b.textContent = follow ? 'Following' : 'Follow'; b.classList.toggle('go', follow);
}
function keepInView(el, force){
  const body = $('trBody'), br = body.getBoundingClientRect(), er = el.getBoundingClientRect(), hgt = br.height;
  if (!force && er.top >= br.top + hgt * 0.12 && er.bottom <= br.top + hgt * 0.62) return;
  body.scrollTo({ top:body.scrollTop + (er.top - br.top) - hgt * 0.28, behavior:'smooth' });
}
function tick(force){
  if (leftTab !== 'tr' || $('trPane').hidden || !curTr || !segEls.length) return;
  const t = playerNow(); if (t == null) return;
  const i = findSeg(t + 0.1);
  const busy = !$('selBar').hidden || !window.getSelection().isCollapsed;
  if (i !== nowSeg){
    const old = segEls[nowSeg];
    if (old){ old.classList.remove('now'); const p = old.closest('.tp'); if (p) p.classList.remove('on'); }
    nowSeg = i;
    const el = segEls[i];
    if (el){ el.classList.add('now'); const p = el.closest('.tp'); if (p) p.classList.add('on'); if (follow && !busy) keepInView(el, force); }
  }
  const g = curTr.segs[i];
  let wEl = null;
  if (g && g.w && t <= g.e + 0.6){
    let lo = 0, hi = g.w.length - 1, k = -1;
    while (lo <= hi){ const m = (lo + hi) >> 1; if (g.w[m][0] <= t + 0.05){ k = m; lo = m + 1; } else hi = m - 1; }
    if (k >= 0) wEl = segEls[i].children[k] || null;
  }
  if (wEl !== nowWord){ if (nowWord) nowWord.classList.remove('now'); if (wEl) wEl.classList.add('now'); nowWord = wEl; }
}
function scrollNow(){
  tick();
  const el = segEls[nowSeg];
  if (el && playerNow() != null) keepInView(el, true); else toast('Start the video first.');
}
async function importNotes(raw){
  const ok = v => typeof v === 'string' && /^[\w-]{11}$/.test(v);
  try {
    for (const n of (Array.isArray(raw.notes) ? raw.notes : [])){
      if (n && ok(n.vid) && n.html) await DB.put('notes', { vid:n.vid, title:String(n.title || ''), html:sanitize(n.html), updated:+n.updated || Date.now() });
    }
    for (const t of (Array.isArray(raw.transcripts) ? raw.transcripts : [])){
      if (!t || !ok(t.vid) || !Array.isArray(t.segs)) continue;
      const names = {};
      for (const k in (t.names || {})) names[String(k)] = String(t.names[k]).slice(0, 60);
      const segs = t.segs.map(x => {
        const o = { s:+x.s || 0, e:+x.e || 0, t:String(x.t || ''), sp:String(x.sp || '') };
        if (Array.isArray(x.w)) o.w = x.w.filter(a => Array.isArray(a) && a.length === 3).map(a => [+a[0] || 0, +a[1] || 0, String(a[2])]);
        return o;
      }).filter(x => x.t);
      if (segs.length) await DB.put('transcripts', { vid:t.vid, kind:segs.some(x => x.sp) ? 'speakers' : 'captions', segs, names, at:+t.at || Date.now() });
    }
    noted.clear();
    for (const k of await DB.keys('notes')) noted.add(k);
  } catch(e){ toast('Notes in that backup could not be restored.'); }
  noteDirty = false; noteVid = null;
  renderAll(false);
}

/* Drag the left edge of the notes page to resize it */
(function(){
  const KEY = 'focus-notesw', MIN = 340, DEF = 520;
  const root = document.documentElement, rz = $('notesResizer'), pane = $('notes');
  const max = () => Math.max(MIN + 40, Math.min(960, window.innerWidth - 520));
  const clamp = w => Math.round(Math.max(MIN, Math.min(max(), w)));
  const apply = w => root.style.setProperty('--notesw', w + 'px');
  const store = w => { try { localStorage.setItem(KEY, String(w)); } catch(e){} };
  try { const w = parseInt(localStorage.getItem(KEY), 10); if (w) apply(clamp(w)); } catch(e){}
  rz.addEventListener('pointerdown', e => {
    e.preventDefault(); rz.setPointerCapture(e.pointerId);
    rz.classList.add('drag'); document.body.classList.add('resizing');
    const x0 = e.clientX, w0 = pane.getBoundingClientRect().width;
    const move = ev => apply(clamp(w0 + x0 - ev.clientX));
    const up = () => {
      rz.classList.remove('drag'); document.body.classList.remove('resizing');
      rz.removeEventListener('pointermove', move); rz.removeEventListener('pointerup', up); rz.removeEventListener('pointercancel', up);
      store(clamp(pane.getBoundingClientRect().width));
    };
    rz.addEventListener('pointermove', move); rz.addEventListener('pointerup', up); rz.addEventListener('pointercancel', up);
  });
  rz.addEventListener('dblclick', () => { apply(DEF); store(DEF); });
  rz.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const w = clamp(pane.getBoundingClientRect().width + (e.key === 'ArrowLeft' ? 24 : -24));
    apply(w); store(w);
  });
})();

(function(){
  const ed = $('editor');

    const lab = el && el.closest && el.closest('.co-l');

      hd.parentNode.setAttribute('data-open', '1'); onEdit(); return;
    }
    if (ico && ed.contains(ico)){
      const co = ico.closest('.co'), k = CO_ORDER[(CO_ORDER.indexOf(co.getAttribute('data-k')) + 1) % CO_ORDER.length];

    }
