<style>
:root{
  --bg:#0a0c10; --panel:#11141b; --card:#161a23; --line:#232836;
  --text:#e9ecf3; --muted:#8b93a7; --accent:#8fb0ff; --accent-ink:#0a1020; --danger:#ff8a94;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:radial-gradient(1200px 500px at 50% -10%,#151b2c 0%,var(--bg) 60%) fixed;color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{display:block}
[hidden]{display:none !important}

.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

/* Stage */
.stage{flex:none;background:linear-gradient(180deg,#141a28 0%,#0f131c 100%);border-bottom:1px solid var(--line)}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px}
.bigplay{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 28px rgba(143,176,255,.35)}
.bigplay svg{width:30px;height:30px;margin-left:4px}
.now{padding:14px 16px 4px}
.now-title{font-weight:650;font-size:18px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.now-sub{color:var(--muted);font-size:13px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;align-items:center;gap:8px;padding:8px 16px 14px}
.ib{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;transition:background .2s}
.ib:active{background:rgba(255,255,255,.14)}
.ib svg{width:22px;height:22px}
.ib:disabled{opacity:.35}
.chip{height:44px;padding:0 16px;border-radius:22px;background:rgba(255,255,255,.07);color:var(--muted);font-size:14px;font-weight:550;white-space:nowrap}
.chip.on{background:rgba(143,176,255,.16);color:var(--accent)}
.spacer{flex:1}

/* Library */
.lib{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.lib-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(10,12,16,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.lib-head h1{flex:1;margin:0;font-size:20px;font-weight:650;letter-spacing:.2px}
.btn{height:44px;padding:0 16px;border-radius:12px;background:var(--card);font-weight:550}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.on{background:rgba(143,176,255,.16);color:var(--accent)}

.folder{margin:12px 12px 0;background:linear-gradient(180deg,#141823,#10131a);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.folder.sub{margin:8px 10px 8px 26px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.folder.sub .folder.sub{background:var(--panel)}
.fhead{display:flex;align-items:center;gap:10px;min-height:62px;padding:0 14px;cursor:pointer;user-select:none;transition:background .2s}
.fhead:active{background:rgba(255,255,255,.03)}
.fhead .chev{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.folder.open > .fhead .chev{transform:rotate(90deg)}
.ficon{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:rgba(143,176,255,.10);font-size:21px;line-height:1}
.folder.sub .ficon{width:32px;height:32px;border-radius:10px;font-size:18px}
.fname{flex:1;min-width:0;font-weight:650;font-size:16.5px;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcount{min-width:26px;height:24px;padding:0 8px;border-radius:12px;background:rgba(255,255,255,.06);color:var(--muted);font-size:12.5px;font-weight:600;display:grid;place-items:center}
.fedit,.vedit{display:flex;flex-wrap:wrap;gap:8px}
.fedit{padding:0 14px 12px}
.vedit{margin-top:6px}
.mini{height:40px;padding:0 12px;border-radius:10px;font-size:14px;color:var(--muted);background:var(--bg)}
.folder.sub .mini{background:var(--panel)}
.mini.danger{color:var(--danger)}
/* Smooth open/close: animate the row height from 0fr to 1fr, fade the content */
.fbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.4,0,.2,1)}
.folder.open > .fbody{grid-template-rows:1fr}
.fin{min-height:0;overflow:hidden}
.fc{border-top:1px solid var(--line);opacity:0;transform:translateY(-6px);
  transition:opacity .22s ease, transform .34s cubic-bezier(.4,0,.2,1)}
.folder.open > .fbody > .fin > .fc{opacity:1;transform:none;transition-delay:.05s}
@media (prefers-reduced-motion:reduce){
  .fbody,.fc,.fhead .chev{transition:none !important}
}
.vid{position:relative;display:flex;align-items:center;gap:12px;min-height:74px;padding:10px 12px 10px 14px;cursor:pointer;transition:background .2s}
.vid + .vid{border-top:1px solid var(--line)}
.vid:active{background:rgba(255,255,255,.04)}
.thumb{position:relative;flex:none;width:96px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#1c2233,#12151d);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ic{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.28);transition:background .2s}
.thumb .ic svg{width:18px;height:18px;margin-left:1px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.vid.cur{background:linear-gradient(90deg,rgba(143,176,255,.14),rgba(143,176,255,0) 85%)}
.vid.cur::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.vid.cur .thumb .ic{background:rgba(10,16,32,.55);color:var(--accent)}
.vid.cur .vn{color:var(--accent)}
.vt{flex:1;min-width:0;display:flex;flex-direction:column}
.vn{overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;font-size:14.5px;line-height:1.3}
.vs{color:var(--muted);font-size:12px}
.none{padding:16px;color:var(--muted);font-size:14px}
.hint{padding:32px 20px;text-align:center;color:var(--muted)}
.tools{display:flex;gap:8px;padding:10px 12px 0}
.tools .mini{background:var(--panel)}
.newfolder{display:block;width:calc(100% - 24px);margin:12px 12px 0;height:56px;border-radius:16px;border:1px dashed var(--line);color:var(--accent);font-weight:600}
.newfolder:active{background:var(--panel)}
.eq{display:flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:currentColor;border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

.resizer{display:none;flex:none;width:12px;margin:0 -6px;position:relative;z-index:4;cursor:col-resize;touch-action:none;outline:none}
.resizer::after{content:"";position:absolute;left:5px;top:50%;width:2px;height:48px;margin-top:-24px;border-radius:2px;background:var(--line);transition:background .2s,height .2s,margin-top .2s}
.resizer:hover::after,.resizer:focus-visible::after,.resizer.drag::after{background:var(--accent);height:72px;margin-top:-36px}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe{pointer-events:none}

/* Selection + bulk actions */
.sel{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.sel svg{width:14px;height:14px}
.vid.picked{background:rgba(143,176,255,.10)}
.vid.picked .sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bulk{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;margin:14px 12px 0;display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-radius:18px;background:rgba(24,29,42,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.bulk .bn{flex:1;font-weight:600;font-size:15px}
.bulk .mini{background:rgba(255,255,255,.07);height:42px}
.bulk .mini.go{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* Sheet */
.sheet-bg{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:14px}
.tabs button{flex:1;height:40px;border-radius:10px;color:var(--muted);font-weight:550}
.tabs button.on{background:var(--card);color:var(--text)}
.sheet h2{margin:0;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none;width:100%;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.note{font-size:12px;color:var(--muted)}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:132px;overflow-y:auto;padding:2px}
.icons button{height:40px;border-radius:10px;background:var(--bg);font-size:21px;line-height:1}
.icons button.on{background:rgba(143,176,255,.2);outline:2px solid var(--accent)}
.err{color:var(--danger);font-size:13px}
.err:empty{display:none}
.row{display:flex;gap:8px}
.row .btn{flex:1;height:50px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (min-width:900px){
  .app{flex-direction:row;padding-top:0}
  .lib{order:1;flex:none;width:var(--libw,380px);border-right:1px solid var(--line)}
  .resizer{display:block;order:2}
  .stage{order:3;flex:1;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:24px 40px;overflow:auto}
  .player{max-width:1100px;margin:0 auto;border-radius:16px;overflow:hidden}
  .now,.controls{width:100%;max-width:1100px;margin:0 auto;padding-left:0;padding-right:0}
  .sheet-bg{align-items:center}
  .sheet{border-radius:22px}
}
@media (orientation:landscape) and (max-height:520px) and (max-width:899px){
  .app{flex-direction:row;padding-left:env(safe-area-inset-left)}
  .stage{width:56%;overflow-y:auto}
  .lib{border-left:1px solid var(--line)}
}
</style>
</head>

<div class="app">

    <div class="player" id="player"></div>
    <div class="now">

      <span class="spacer"></span>
      <button class="chip" id="loop">Loop</button>
      <button class="chip" id="sleep">Sleep timer</button>
    </div>

  <aside class="lib" id="lib">

    <div class="field" id="fUrl"><label for="url">YouTube link</label>

    <div class="field" id="fTitle"><label for="title">Title</label>

    <div class="field" id="fFolder"><label for="fsel">Folder</label>

    <div class="field" id="fIcons"><label>Icon</label><div class="icons" id="icons"></div></div>
    <div class="field" id="fParent"><label for="psel">Inside</label>

    <div class="field" id="fChan"><label for="chan">Auto-add from channel (optional)</label>

    <div class="row">
      <button class="btn" id="cancel">Cancel</button>

    </div>

</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

  am.videos = AMBIENT_SEED.map(v => ({ id:rid(), title:v.title, vid:v.vid, list:null, t:v.t }));
  return { updated:0, loop:false, cur:null, folders:[ newNode('Focus','🎯'), am, sl, star ] };
}
const DEFAULT_ICONS = { focus:'🎯', sleep:'😴' };
function normNode(f){
  const n = {
    id:String(f.id || rid()), name:String(f.name || 'Folder'),
    icon:typeof f.icon === 'string' && f.icon ? f.icon : (DEFAULT_ICONS[String(f.name||'').toLowerCase()] || '📁'),
    open:f.open !== false,
    videos:(Array.isArray(f.videos) ? f.videos : []).map(v => ({
      id:String(v.id || rid()), title:String(v.title || 'Untitled'),
      vid:v.vid || null, list:v.list || null, t:+v.t || 0
    })).filter(v => v.vid || v.list),
    children:(Array.isArray(f.children) ? f.children : []).map(normNode),
    channel:null
  };
  if (f.channel && f.channel.ref) n.channel = {
    ref:String(f.channel.ref), last:+f.channel.last || 0,
    seen:Array.isArray(f.channel.seen) ? f.channel.seen.map(String).slice(-400) : []
  };
  return n;
}
function normalize(r){
  const s = { updated:+r.updated || 0, loop:!!r.loop, cur:null, folders:(Array.isArray(r.folders) ? r.folders : []).map(normNode) };
  if (r.cur && r.cur.f && r.cur.v) s.cur = { f:String(r.cur.f), v:String(r.cur.v) };
  return s;
}
function localLoad(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return normalize(JSON.parse(raw)); } catch(e){}
  return null;
}
function localSave(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }

function save(){ state.updated = Date.now(); localSave(); }

/* ---------- Tree helpers ---------- */
function findNode(id, list){
  list = list || state.folders;
  for (const n of list){
    if (n.id === id) return { node:n, list };
    const r = findNode(id, n.children);
    if (r) return r;
  }
  return null;
}
function flatten(list, depth, trail, out){
  out = out || []; depth = depth || 0; trail = trail || [];
  for (const n of list){
    const t = trail.concat(n.name);
    out.push({ node:n, depth, label:(n.icon || '📁') + ' ' + t.join(' › ') });
    flatten(n.children, depth + 1, t, out);
  }
  return out;
}
function countAll(n){ return n.videos.length + n.children.reduce((a, c) => a + countAll(c), 0); }
function contains(n, id){ return n.id === id || n.children.some(c => contains(c, id)); }
function findCur(){
  if (!state.cur) return null;
  const r = findNode(state.cur.f); if (!r) return null;
  const v = r.node.videos.find(x => x.id === state.cur.v); if (!v) return null;
  return { f:r.node, v };
}

/* ---------- YouTube links ---------- */
function parseT(s){
  if (!s) return 0;
  if (/^\d+$/.test(s)) return +s;
  const m = s.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
  return m ? (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0) : 0;
}
function parseYT(input){
  let s = (input||'').trim();
  if (!s) return null;
  if (!/^https?:\/\//i.test(s)){
    if (/^[\w-]{11}$/.test(s)) return { vid:s, list:null, t:0 };
    s = 'https://' + s;
  }
  let u; try { u = new URL(s); } catch(e){ return null; }
  const host = u.hostname.replace(/^(www\.|m\.)/, '');
  let vid = null, list = u.searchParams.get('list') || null;
  if (host === 'youtu.be') vid = u.pathname.slice(1).split('/')[0];
  else if (host.endsWith('youtube.com') || host.endsWith('youtube-nocookie.com')){
    if (u.pathname === '/watch') vid = u.searchParams.get('v');
    else { const m = u.pathname.match(/^\/(shorts|embed|live|v)\/([\w-]{11})/); if (m) vid = m[2]; }
  } else return null;
  if (vid && !/^[\w-]{11}$/.test(vid)) vid = null;
  if (list && !/^[\w-]+$/.test(list)) list = null;
  if (list && /^RD/.test(list)) list = null;
  if (!vid && !list) return null;
  return { vid, list, t:parseT(u.searchParams.get('t') || u.searchParams.get('start')) };
}
function embedUrl(v){
  const p = new URLSearchParams({ autoplay:'1', playsinline:'1', rel:'0', modestbranding:'1' });
  let base;
  if (!v.vid){ base = 'https://www.youtube.com/embed/videoseries'; p.set('list', v.list); }
  else {
    base = 'https://www.youtube.com/embed/' + v.vid;
    if (v.list) p.set('list', v.list);
    if (v.t) p.set('start', String(v.t));
  }
  if (state.loop){ p.set('loop','1'); if (v.vid && !v.list) p.set('playlist', v.vid); }
  return base + '?' + p.toString();
}

/* ---------- Titles and channel feeds ---------- */
async function fetchJson(url, ms){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 6000);
  try {
    const r = await fetch(url, { signal:ctl.signal, cache:'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
const titleCache = {};
async function fetchTitle(vid){
  if (titleCache[vid]) return titleCache[vid];
  const watch = 'https://www.youtube.com/watch?v=' + vid;
  const urls = [
    'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(watch),
    'https://noembed.com/embed?url=' + encodeURIComponent(watch)
  ];
  for (const u of urls){
    try { const j = await fetchJson(u); if (j && j.title){ titleCache[vid] = String(j.title); return titleCache[vid]; } }
    catch(e){}
  }
  return null;
}
let feedsP = null;
function loadFeeds(force){
  if (!feedsP || force) feedsP = fetchJson('feeds.json', 6000)
    .then(j => (j && j.channels) ? j : { channels:{} })
    .catch(() => ({ channels:{} }));
  return feedsP;
}
const syncing = new Set();
async function syncNode(f){
  if (!f.channel || syncing.has(f.id)) return 0;
  syncing.add(f.id);
  try {
    const feeds = await loadFeeds();
    const ch = feeds.channels[f.channel.ref];
    if (!ch || !Array.isArray(ch.videos)) return 0;
    const vids = ch.videos.filter(v => v && v.id);
    const seen = new Set(f.channel.seen || []);
    const fresh = vids.filter(v => !seen.has(v.id));
    const add = f.channel.last ? fresh : fresh.slice(0, FIRST_SYNC);   // feed is newest first
    f.videos = add.map(v => ({ id:rid(), title:String(v.title || 'Untitled'), vid:v.id, list:null, t:0 })).concat(f.videos);
    for (const v of vids) seen.add(v.id);
    f.channel.seen = Array.from(seen).slice(-400);
    f.channel.last = Date.now();
    save();
    return add.length;
  } finally { syncing.delete(f.id); }
}
async function autoSync(force){
  if (force) await loadFeeds(true);
  let total = 0;
  for (const x of flatten(state.folders)){ if (x.node.channel) total += await syncNode(x.node); }
  if (total){ renderAll(false); toast(total + ' new video' + (total > 1 ? 's' : '')); }
}

/* ---------- Playback ---------- */
function showEmpty(){
  const box = $('player'); box.replaceChildren();
  const c = findCur();
  if (c){
    const b = h('button', { class:'bigplay', 'aria-label':'Play' });
    b.innerHTML = ICON.play;
    b.addEventListener('click', () => play(c.f.id, c.v.id));
    box.append(h('div', { class:'empty' }, b));
  } else {
    box.append(h('div', { class:'empty' }, 'Pick a video from your library'));
  }
}
function play(fid, vid){
  const r = findNode(fid); if (!r) return;
  const v = r.node.videos.find(x => x.id === vid); if (!v) return;
  state.cur = { f:fid, v:vid };
  playing = true;
  save();
  const box = $('player'); box.replaceChildren();
  box.append(h('iframe', {
    src:embedUrl(v), title:v.title, allowfullscreen:'',
    allow:'autoplay; encrypted-media; picture-in-picture; fullscreen',
    referrerpolicy:'strict-origin-when-cross-origin'
  }));
  renderAll(false);
}
function stop(){ playing = false; showEmpty(); renderAll(false); }
function step(dir){
  const c = findCur(); if (!c) return;
  const list = c.f.videos; if (list.length < 2) return;
  const i = list.findIndex(x => x.id === c.v.id);
  play(c.f.id, list[(i + dir + list.length) % list.length].id);
}

function renderNow(){

const armed = new Set();
function confirmBtn(key, label, onGo){
  const b = h('button', { class:'mini danger' }, label);
  b.addEventListener('click', ev => {
    ev.stopPropagation();
    if (armed.has(key)){ armed.delete(key); onGo(); return; }
    armed.add(key); b.textContent = 'Sure?';

  });

}
function mini(label, fn){ return h('button', { class:'mini', onclick:ev => { ev.stopPropagation(); fn(); } }, label); }

function renderNode(f, depth){
  const head = h('div', { class:'fhead', role:'button', tabindex:'0' },

      const im = h('img', { src:'https://i.ytimg.com/vi/' + v.vid + '/mqdefault.jpg', alt:'', loading:'lazy', decoding:'async', referrerpolicy:'no-referrer' });

    const row = h('div', { class:'vid' + (isCur ? ' cur' : '') + (picked ? ' picked' : ''), role:'button', tabindex:'0' },
      chk,
      thumb,
      h('span', { class:'vt' },
        h('span', { class:'vn' }, v.title),
        (!v.vid && v.list) ? h('span', { class:'vs' }, 'Playlist') : null,
        editMode ? h('span', { class:'vedit' },
          mini('Rename', () => openSheet('renamevideo', { f:f.id, v:v.id })),
          mini('Move', () => openSheet('move', { ids:[v.id] })),

function renderFolders(){
  const root = $('folders'); root.replaceChildren();
  root.classList.toggle('edit', editMode);
  if (editMode){
    root.append(h('div', { class:'tools' },
      mini('Export backup', exportBackup),

  }

}
function renderAll(withPlayer){

}

/* ---------- Edit ---------- */
const selected = new Set();
function findVideo(vid){
  for (const x of flatten(state.folders)){
    const v = x.node.videos.find(y => y.id === vid);
    if (v) return { folder:x.node, video:v };
  }
  return null;
}
function moveVideos(ids, dest){
  let n = 0;
  for (const id of ids){
    const hit = findVideo(id);
    if (!hit || hit.folder.id === dest.id) continue;
    hit.folder.videos = hit.folder.videos.filter(y => y.id !== id);
    dest.videos.push(hit.video);
    if (state.cur && state.cur.v === id) state.cur.f = dest.id;
    n++;
  }
  if (n) dest.open = true;
  return n;
}
function deleteSelected(){
  const ids = [...selected];
  for (const id of ids){
    const hit = findVideo(id); if (!hit) continue;
    hit.folder.videos = hit.folder.videos.filter(y => y.id !== id);
    if (state.cur && state.cur.v === id){ state.cur = null; playing = false; showEmpty(); }
  }
  selected.clear(); save(); renderAll(false);
  toast('Deleted ' + ids.length + (ids.length > 1 ? ' videos' : ' video'));
}
function toggleSel(id){ if (selected.has(id)) selected.delete(id); else selected.add(id); renderFolders(); }
function renderBulk(){
  const b = $('bulk');
  b.hidden = !(editMode && selected.size);
  b.replaceChildren();
  if (b.hidden) return;
  b.append(
    h('span', { class:'bn' }, selected.size + ' selected'),
    h('button', { class:'mini go', onclick:() => openSheet('move', { ids:[...selected] }) }, 'Move'),
    confirmBtn('bulkdel', 'Delete', deleteSelected),
    h('button', { class:'mini', 'aria-label':'Clear selection', onclick:() => { selected.clear(); renderFolders(); } }, '✕')
  );
}
function deleteVideo(fid, vid){
  const r = findNode(fid); if (!r) return;
  const wasCur = state.cur && state.cur.v === vid;
  r.node.videos = r.node.videos.filter(v => v.id !== vid);
  if (wasCur){ state.cur = null; playing = false; showEmpty(); }
  save(); renderAll(false);
}
function deleteFolder(fid){
  const r = findNode(fid); if (!r) return;
  if (state.cur && contains(r.node, state.cur.f)){ state.cur = null; playing = false; showEmpty(); }
  const i = r.list.indexOf(r.node); if (i >= 0) r.list.splice(i, 1);
  save(); renderAll(false);
}

/* ---------- Backup ---------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'focus-library-backup.json';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importBackup(file){
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const r = normalize(JSON.parse(String(rd.result)));
      if (!r.folders.length) throw new Error('empty');
      state = r; state.updated = Date.now(); localSave();
      playing = false; showEmpty(); renderAll(false); toast('Backup restored');
    } catch(e){ toast('That file is not a Focus Library backup.'); }
  };
  rd.readAsText(file);
}

/* ---------- Sheet ---------- */
let sheetMode = 'video', sheetCtx = null, pickedIcon = '📁', titleTouched = false, fetchSeq = 0, saving = false;
const SHOW = {
  video:['fUrl','fTitle','fFolder'],
  folder:['fName','fIcons','fParent','fChan'],
  renamefolder:['fName','fIcons','fChan'],
  renamevideo:['fTitle'],
  move:['fFolder']
};
const ALL_FIELDS = ['fUrl','fTitle','fFolder','fName','fIcons','fParent','fChan'];
const HEAD = { renamefolder:'Edit folder', renamevideo:'Rename video', move:'Move to folder' };

function setPane(mode){

function fillSelect(sel, selectedId, withTop){

function buildIcons(){

async function fillChannels(current){
  const sel = $('chan');
  sel.replaceChildren(h('option', { value:'' }, 'None'));
  const feeds = await loadFeeds();
  const keys = Object.keys(feeds.channels);
  for (const k of keys) sel.append(h('option', { value:k }, feeds.channels[k].name || k));
  if (current && keys.indexOf(current) < 0) sel.append(h('option', { value:current }, current));
  sel.value = current || '';
  $('chanNote').textContent = keys.length ? 'New uploads are added automatically.' : 'No channels are tracked yet.';
}
function openSheet(mode, ctx){
  if (mode === 'video' && !state.folders.length) mode = 'folder';
  sheetCtx = ctx || null;
  setPane(mode);
  $('url').value = ''; $('title').value = ''; $('fname').value = '';
  titleTouched = false; fetchSeq++; saving = false;
  pickedIcon = '📁';
  if (mode === 'video'){
    const pref = (state.cur && state.cur.f) || (state.folders[0] && state.folders[0].id);
    fillSelect($('fsel'), pref, false);
  } else if (mode === 'folder'){
    fillSelect($('psel'), ctx && ctx.parent, true);
    buildIcons(); fillChannels('');
  } else if (mode === 'renamefolder'){

function closeSheet(){ $('sheetBg').classList.remove('open'); fetchSeq++; }

async function onUrlInput(){

  $('title').placeholder = 'Fetching title…';

  if (seq !== fetchSeq || titleTouched) return;

}

async function submitSheet(){
  if (saving) return;
  const err = $('err'); err.textContent = '';
  if (sheetMode === 'video'){
    const p = parseYT($('url').value);
    if (!p){ err.textContent = 'That is not a YouTube link.'; return; }
    const r = findNode($('fsel').value); if (!r){ err.textContent = 'Pick a folder.'; return; }
    saving = true;
    let title = $('title').value.trim();
    if (!title && p.vid) title = (await fetchTitle(p.vid)) || '';
    if (!title) title = (!p.vid && p.list) ? 'Playlist' : 'Untitled';
    saving = false;
    r.node.videos.push({ id:rid(), title, vid:p.vid, list:p.list, t:p.t });
    r.node.open = true;
    save(); renderAll(false); closeSheet(); toast('Added to ' + r.node.name);
  } else if (sheetMode === 'move'){
    const dest = findNode($('fsel').value); if (!dest){ err.textContent = 'Pick a folder.'; return; }
    const n = moveVideos(sheetCtx.ids, dest.node);
    selected.clear(); save(); renderAll(false); closeSheet();
    toast(n ? 'Moved ' + n + ' to ' + dest.node.name : 'Already in ' + dest.node.name);
  } else if (sheetMode === 'renamevideo'){
    const title = $('title').value.trim();
    if (!title){ err.textContent = 'Enter a title.'; return; }
    const r = findNode(sheetCtx.f); const v = r && r.node.videos.find(x => x.id === sheetCtx.v);
    if (v) v.title = title;
    save(); renderAll(false); closeSheet();
  } else {
    const name = $('fname').value.trim();
    if (!name){ err.textContent = 'Enter a name.'; return; }
    const ref = $('chan').value;
    let node, isNew = false;
    if (sheetMode === 'renamefolder'){
      const r = findNode(sheetCtx.id); if (!r) return;
      node = r.node; node.name = name; node.icon = pickedIcon;
    } else {
      node = newNode(name, pickedIcon); isNew = true;
      const par = $('psel').value ? findNode($('psel').value) : null;
      if (par){ par.node.children.push(node); par.node.open = true; } else state.folders.push(node);
    }
    const changedChan = ref ? (!node.channel || node.channel.ref !== ref) : !!node.channel;
    if (changedChan) node.channel = ref ? { ref, last:0, seen:[] } : null;
    save(); renderAll(false); closeSheet();
    if (node.channel && (isNew || changedChan)){
      const c = await syncNode(node);
      renderAll(false); toast(c + ' video' + (c === 1 ? '' : 's') + ' added');
    }
  }
}

let toastTimer = 0;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---------- Sleep timer ---------- */
const SLEEP = [0, 15, 30, 60, 90];
let sleepIdx = 0, sleepEnd = 0;
function updSleep(){
  const b = $('sleep');
  if (!sleepEnd){ b.textContent = 'Sleep timer'; b.classList.remove('on'); return; }
  b.textContent = 'Sleep · ' + Math.max(1, Math.ceil((sleepEnd - Date.now()) / 60000)) + 'm';
  b.classList.add('on');
}
function tick(){
  if (!sleepEnd) return;
  if (Date.now() >= sleepEnd){
    sleepEnd = 0; sleepIdx = 0; updSleep();
    if (playing){ stop(); toast('Sleep timer ended. Playback stopped.'); }
    return;
  }
  updSleep();
}

/* ---------- Wiring ---------- */
$('prev').innerHTML = ICON.prev; $('next').innerHTML = ICON.next;
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
$('loop').addEventListener('click', () => {
  state.loop = !state.loop; save();
  const c = findCur();
  if (playing && c) play(c.f.id, c.v.id); else renderNow();
});
$('sleep').addEventListener('click', () => {
  sleepIdx = (sleepIdx + 1) % SLEEP.length;
  sleepEnd = SLEEP[sleepIdx] ? Date.now() + SLEEP[sleepIdx] * 60000 : 0;
  updSleep();
});
/* Resizable library (desktop): drag the divider, arrow keys, or double-click to reset */
(function(){
  const KEY = 'focus-libw', MIN = 260, DEF = 380;
  const root = document.documentElement, rz = $('resizer'), lib = $('lib');
  const max = () => Math.max(MIN + 40, Math.min(720, window.innerWidth - 420));
  const clamp = w => Math.round(Math.max(MIN, Math.min(max(), w)));
  const apply = w => root.style.setProperty('--libw', w + 'px');
  const store = w => { try { localStorage.setItem(KEY, String(w)); } catch(e){} };
  try { const w = parseInt(localStorage.getItem(KEY), 10); if (w) apply(clamp(w)); } catch(e){}
  rz.addEventListener('pointerdown', e => {
    e.preventDefault(); rz.setPointerCapture(e.pointerId);
    rz.classList.add('drag'); document.body.classList.add('resizing');
    const left = lib.getBoundingClientRect().left;
    const move = ev => apply(clamp(ev.clientX - left));
    const up = () => {
      rz.classList.remove('drag'); document.body.classList.remove('resizing');
      rz.removeEventListener('pointermove', move); rz.removeEventListener('pointerup', up); rz.removeEventListener('pointercancel', up);
      store(clamp(lib.getBoundingClientRect().width));
    };
    rz.addEventListener('pointermove', move); rz.addEventListener('pointerup', up); rz.addEventListener('pointercancel', up);
  });
  rz.addEventListener('dblclick', () => { apply(DEF); store(DEF); });
  rz.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const w = clamp(lib.getBoundingClientRect().width + (e.key === 'ArrowRight' ? 24 : -24));
    apply(w); store(w);
  });
  window.addEventListener('resize', () => { const w = lib.getBoundingClientRect().width; if (window.innerWidth >= 900 && w > max()) apply(clamp(w)); });
})();
$('editBtn').addEventListener('click', () => { editMode = !editMode; armed.clear(); if (!editMode) selected.clear(); renderNow(); renderFolders(); });
$('addBtn').addEventListener('click', () => openSheet('video'));
$('tabVideo').addEventListener('click', () => {
  if (!state.folders.length){ $('err').textContent = 'Create a folder first.'; return; }
  setPane('video'); fillSelect($('fsel'), state.folders[0].id, false);
});
$('tabFolder').addEventListener('click', () => { setPane('folder'); fillSelect($('psel'), null, true); buildIcons(); fillChannels(''); });
$('cancel').addEventListener('click', closeSheet);
$('save').addEventListener('click', submitSheet);
$('sheetBg').addEventListener('click', e => { if (e.target === $('sheetBg')) closeSheet(); });
$('url').addEventListener('input', onUrlInput);
$('title').addEventListener('input', () => { titleTouched = true; });
for (const id of ['url','title','fname']) $(id).addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); submitSheet(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
setInterval(tick, 1000);
document.addEventListener('visibilitychange', tick);

/* ---------- Boot ---------- */
const stored = localLoad();
if (stored) state = stored;
$('importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importBackup(f); e.target.value = ''; });
document.addEventListener('visibilitychange', () => { if (!document.hidden) autoSync(true); });
renderAll();
autoSync();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
